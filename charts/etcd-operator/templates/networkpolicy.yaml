{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "etcd-operator.fullname" . }}-allow-metrics-traffic
  namespace: {{ include "etcd-operator.namespace" . }}
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      {{- include "etcd-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # 仅允许来自带指定标签的命名空间的流量访问 8443 (metrics)
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.namespaceSelector | nindent 12 }}
      ports:
        - port: 8443
          protocol: TCP
{{- end }}
