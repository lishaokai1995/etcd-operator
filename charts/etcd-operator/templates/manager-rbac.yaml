{{- if .Values.rbac.create }}
# 控制器运行所需的集群级权限（config/rbac/role.yaml，由 controller-gen 从代码生成）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "etcd-operator.fullname" . }}-manager-role
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - get
      - list
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - pods
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - clusterissuers
      - issuers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operator.etcd.io
    resources:
      - etcdclusters
      - etcdmembers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - operator.etcd.io
    resources:
      - etcdclusters/finalizers
      - etcdmembers/finalizers
    verbs:
      - update
  - apiGroups:
      - operator.etcd.io
    resources:
      - etcdclusters/status
      - etcdmembers/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "etcd-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "etcd-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "etcd-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "etcd-operator.serviceAccountName" . }}
    namespace: {{ include "etcd-operator.namespace" . }}
{{- end }}
